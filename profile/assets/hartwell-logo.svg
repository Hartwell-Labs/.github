<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="Hartwell Labs">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F15A24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F15A24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="720" height="180" rx="16"/></clipPath>
  </defs>

  <rect width="720" height="180" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="718" height="178" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- mark: hexagon (draw-on loop) + ECG pulse + pulsing glow -->
  <g transform="translate(78,90)">
    <circle r="52" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-46 L40,-23 L40,23 L0,46 L-40,23 L-40,-23 Z"
          fill="none" stroke="#F15A24" stroke-width="5" stroke-linejoin="round"
          stroke-dasharray="277 277">
      <animate attributeName="stroke-dashoffset" values="277;0;0;277" keyTimes="0;0.45;0.7;1"
               dur="6s" repeatCount="indefinite"/>
    </path>
    <polyline points="-22,4 -10,4 -4,-14 4,16 10,2 22,2"
              fill="none" stroke="#F15A24" stroke-width="4.5"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="88 88">
      <animate attributeName="stroke-dashoffset" values="88;0" dur="1.8s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- wordmark -->
  <text x="140" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="3">HARTWELL<tspan font-weight="300" fill="#F15A24"> LABS</tspan></text>

  <!-- tagline -->
  <text x="142" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="14.5" fill="#8b949e" letter-spacing="4">SECURITY SYSTEMS &#183; LANGUAGES &#183; TOOLS</text>

  <!-- sheen sweep across the whole badge -->
  <g clip-path="url(#frame)" opacity="0.6">
    <rect x="-160" y="-20" width="120" height="220" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-160;780" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
