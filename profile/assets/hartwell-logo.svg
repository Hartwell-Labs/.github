<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="Hartwell Labs">
  <rect width="720" height="180" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="718" height="178" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- mark: hexagon + pulse -->
  <g transform="translate(78,90)">
    <path d="M0,-46 L40,-23 L40,23 L0,46 L-40,23 L-40,-23 Z"
          fill="none" stroke="#F15A24" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="-22,4 -10,4 -4,-14 4,16 10,2 22,2"
              fill="none" stroke="#F15A24" stroke-width="4.5"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="140" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="3">HARTWELL<tspan font-weight="300" fill="#F15A24"> LABS</tspan></text>

  <!-- tagline -->
  <text x="142" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="14.5" fill="#8b949e" letter-spacing="4">SECURITY SYSTEMS &#183; LANGUAGES &#183; TOOLS</text>
</svg>
